name: Newman API Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: src/eshop-sut/backend
        run: npm install

      - name: Start backend server
        working-directory: src/eshop-sut/backend
        run: |
          node server.js &
          echo "Waiting for server to start..."
          sleep 5
          curl -f http://localhost:3000/api/products || exit 1
          echo "Server is ready!"

      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman tests
        working-directory: api-testing
        run: |
          newman run mini-products.postman_collection.json \
            -e mini-local.postman_environment.json \
            -d mini-products.data.json \
            -r "cli,json" \
            --reporter-json-export mini-newman-report.json

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: api-testing/mini-newman-report.json
