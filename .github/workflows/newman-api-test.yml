name: Newman API tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  newman-product-detail:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Newman
        run: npm install --global newman

      - name: Start backend provider
        working-directory: backend
        run: |
          node server.js > ../backend.log 2>&1 &
          echo $! > ../backend.pid
          sleep 5

      - name: Smoke check provider
        run: curl --fail http://localhost:3000/api/products/1

      - name: Run Newman collection
        run: |
          newman run mini-product-detail.postman_collection.json \
            --environment mini-local.postman_environment.json \
            --iteration-data mini-product-detail.data.json \
            --reporters cli,json \
            --reporter-json-export mini-newman-report.json

      - name: Upload Newman report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-newman-report
          path: |
            mini-newman-report.json
            backend.log
