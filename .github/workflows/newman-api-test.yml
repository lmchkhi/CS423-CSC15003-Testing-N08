name: Newman API Tests

on:
  push:
  workflow_dispatch:

jobs:
  update-product-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Start EShop provider
        run: |
          npm --prefix backend run dev > backend.log 2>&1 &
          echo $! > backend.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/products/1 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Install Newman
        run: npm install --global newman

      - name: Run five data-driven iterations
        run: |
          newman run mini-update-product.postman_collection.json \
            --environment mini-local.postman_environment.json \
            --iteration-data mini-update-product.data.json \
            --reporters cli,json \
            --reporter-json-export mini-newman-report.json

      - name: Upload Newman evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini-newman-evidence
          path: |
            mini-newman-report.json
            backend.log
          if-no-files-found: warn
