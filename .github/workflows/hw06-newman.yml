name: HW06 Newman API Tests

on:
  push:
    branches: ["HW06/23127300"]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone & start SUT
        run: |
          git clone https://github.com/ttbhanh/eshop-sut.git sut
          cd sut/backend && npm install
          node server.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/products && break
            sleep 1
          done

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run full collection
        run: |
          newman run api/collections/eshop-hw06.postman_collection.json \
            -e api/environments/local.postman_environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export newman-ci-report.html \
            --reporter-htmlextra-title "HW06 API Tests – 23127300"

      - name: Upload Newman report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: newman-ci-report.html
