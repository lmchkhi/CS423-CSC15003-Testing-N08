name: HW06 Newman API Tests

on:
  push:
    branches: ["HW06/23127300"]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone & start SUT
        run: |
          git clone https://github.com/ttbhanh/eshop-sut.git sut
          cd sut/backend && npm install
          node server.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/products && break
            sleep 1
          done

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run API suite (per folder)
        run: |
          set -e
          C=api/collections/eshop-hw06.postman_collection.json
          E=api/environments/local.postman_environment.json
          mkdir -p newman-reports
          run() { # $1 folder  $2 out-name  $3 optional data file
            newman run "$C" -e "$E" --folder "$1" ${3:+-d "$3"} \
              -r cli,htmlextra \
              --reporter-htmlextra-export "newman-reports/$2.html" \
              --reporter-htmlextra-title "HW06 $1 – 23127300"
          }
          # Data-driven folders run with their data file; state/lifecycle folders run once.
          run "FR-01 Register"            fr01-register     api/data/register-cases.json
          run "FR-08 Checkout"            fr08-checkout     api/data/checkout-cases.json
          run "FR-08 State & Security"    fr08-state
          run "FR-14 Category CRUD"       fr14-category     api/data/fr14-post-categories.csv
          run "FR-14 Lifecycle & Access"  fr14-lifecycle
          # DEMO: intentionally-failing folder to show the pipeline catches failures (reverted next commit).
          run "DEMO Failing (intentional)" demo-failing

      - name: Upload Newman reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-reports
          path: newman-reports/
