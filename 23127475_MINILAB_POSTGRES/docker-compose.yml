services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eshop_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - .:/workspace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eshop_test"]
      interval: 3s
      timeout: 3s
      retries: 20
