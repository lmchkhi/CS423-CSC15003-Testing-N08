# Explicit .jtl and dashboard configuration for the HW05 runs.
# Passed to every run with -q so results do not depend on the local
# JMeter installation's defaults.

# ---- what gets written to the raw .jtl ----
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.print_field_names=true
jmeter.save.saveservice.timestamp_format=ms
jmeter.save.saveservice.time=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.label=true
jmeter.save.saveservice.response_code=true
jmeter.save.saveservice.response_message=true
jmeter.save.saveservice.successful=true
jmeter.save.saveservice.assertion_results_failure_message=true
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.sent_bytes=true
jmeter.save.saveservice.url=true
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.thread_name=true
jmeter.save.saveservice.idle_time=true

# ---- HTML dashboard ----
jmeter.reportgenerator.overall_granularity=5000
jmeter.reportgenerator.apdex_satisfied_threshold=500
jmeter.reportgenerator.apdex_tolerated_threshold=1500
aggregate_rpt_pct1=90
aggregate_rpt_pct2=95
aggregate_rpt_pct3=99

# ---- connection reuse across thread-group iterations ----
# JMeter's default (true) closes and reopens the HTTP connection at the
# start of every iteration, even though every sampler in these plans sets
# HTTPSampler.use_keepalive=true and the SUT itself honours keep-alive
# (verified: Connection: keep-alive, Keep-Alive: timeout=5 on both a GET
# and a POST). At zero think time that default turned a ~50-thread run
# into ~1000 fresh sockets/second: measured TIME_WAIT against port 3000
# climbing 1042 -> 7791 in 15 s while ESTABLISHED stayed near thread count
# (~50-100) — see perf/results/calibration/calibration-20260814.md,
# "Extension 2". That is local ephemeral-port exhaustion from this
# property, not the SUT's own capacity, so it is disabled here: a thread's
# connection now persists across its iterations, matching the keep-alive
# behaviour the samplers already ask for.
httpclient.reset_state_on_thread_group_iteration=false
